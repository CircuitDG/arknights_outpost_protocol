name: 🐛 Bug 报告
description: 报告一个问题或崩溃
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "## 请填写以下信息"
  - type: input
    id: godot_version
    attributes:
      label: Godot 版本
      placeholder: 4.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统
      placeholder: Windows 11 / Ubuntu 22.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      placeholder: 清晰描述你遇到的问题
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开游戏... 2. 点击...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误日志
      render: shell